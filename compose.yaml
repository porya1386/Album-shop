services:
  web:
    build: .
    container_name: album-shop
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    environment:
      DEBUG: "True"
      POSTGRES_DB: album_shop_db
      POSTGRES_USER: django_admin
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: album-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: album_shop_db
      POSTGRES_USER: django_admin
      POSTGRES_PASSWORD: test_password_123
    ports:
      - "5432:5432"
    volumes:
      - album_shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_admin -d album_shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: album-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - album_shop_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  album_shop_pgdata:
  album_shop_redisdata: