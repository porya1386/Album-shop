name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (inside Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the same image you deploy, so tests run in the real environment.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jahan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Django tests
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-only-not-secret \
            -e DEBUG=0 \
            jahan:ci python manage.py test --noinput -v 2

  publish:
    name: Publish image to GHCR
    needs: test
    # only after tests pass, only on main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

