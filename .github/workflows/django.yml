name: Django CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Same services as your docker-compose (postgres:16 and redis:7).
    # They are reached on localhost from the runner, not by the compose names.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_shop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # !! Rename these to the variable names your settings.py really reads !!
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "0"
      POSTGRES_DB: album_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/album_shop
      REDIS_HOST: localhost
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput -v 2

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r django-project.zip . \
            -x ".git/*" \
               ".github/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               "db.sqlite3" \
               ".env" \
               "venv/*" \
               ".venv/*"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: django-deployment
          path: django-project.zip
          retention-days: 7