
name: Django CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_shop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

      POSTGRES_DB: album_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

      DATABASE_URL: postgres://postgres:postgres@localhost:5432/album_shop
      REDIS_HOST: localhost
      REDIS_URL: redis://localhost:6379/0

      # Dummy keys for CI checks and tests.
      # Do not use these for a deployed website.
      RECAPTCHA_PUBLIC_KEY: ci-test-site-key
      RECAPTCHA_PRIVATE_KEY: ci-test-secret-key
      RECAPTCHA_DOMAIN: www.recaptcha.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput -v 2

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r django-project.zip . \
            -x ".git/*" \
               ".github/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               "db.sqlite3" \
               ".env" \
               ".env.*" \
               "!.env.example" \
               "venv/*" \
               ".venv/*"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: django-deployment
          path: django-project.zip
          retention-days: 7
