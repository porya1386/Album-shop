{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block page_title %}<title>Base Title</title>{% endblock page_title %}
    {% block page_style %}{% endblock page_style %}
    <link rel="stylesheet" href="{% static 'footer.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'glow.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'root.css' %}">
    <link rel="stylesheet" href="{% static 'header.css' %}">
</head>
<body>
    {% include "includes/header.html" %}
    {% block page_content %}{% endblock page_content %}
    {% block page_script %}{% endblock page_script %}
    {% include "includes/footer.html" %}
    <script src="{% static 'js/glow.js' %}"></script>
</body>
</html>
